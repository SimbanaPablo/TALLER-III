##        GROQ
server:
  port: 8090

app:
  key: xyz
  aimodel: llama-3.1-8b-instant
  url: https://api.groq.com/openai/v1

spring:
  ai:
    model:
      embedding: transformers
    embedding:
      transformer:
        onnx:
          model-url: classpath:models/model.onnx
        tokenizer:
          url: classpath:models/model/tokenizer.json

    openai:
      api-key: ${app.key}
      base-url: ${app.url}
      chat:
        model: ${app.aimodel}

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG